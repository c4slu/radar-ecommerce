name: sync-supplier-feeds
on:
  schedule:
    - cron: "30 9 * * *" # 06:30 de Brasília, depois da coleta de oportunidades
  workflow_dispatch:
concurrency:
  group: sync-supplier-feeds
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run sync:feeds
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
