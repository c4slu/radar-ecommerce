name: collect-fx
on:
  schedule:
    - cron: "0 12 * * 1-5" # 09:00 de Brasília, dias úteis
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run collect:fx
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
