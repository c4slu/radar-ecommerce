name: collect-ml
on:
  schedule:
    - cron: "15 */6 * * *" # a cada 6h (00:15, 06:15, 12:15, 18:15 UTC)
  workflow_dispatch:
concurrency:
  group: collect-ml # nunca duas coletas ao mesmo tempo (o refresh token do ML é de uso único)
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run collect:ml
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
